name: QA Agent

on:
  push:
      branches: [main]
        pull_request:
            branches: [main]
              schedule:
                  - cron: '0 */6 * * *'

                  jobs:
                    qa:
                        runs-on: ubuntu-latest
                            permissions:
                                  contents: write
                                        issues: write
                                            
                                                steps:
                                                      - uses: actions/checkout@v4
                                                            
                                                                  - uses: actions/setup-node@v4
                                                                          with:
                                                                                    node-version: '20'
                                                                                              cache: 'npm'
                                                                                                    
                                                                                                          - run: npm ci
                                                                                                                
                                                                                                                      - name: Lint
                                                                                                                              run: npx eslint src/ --ext .js --format json --output-file eslint-report.json || true
                                                                                                                                    
                                                                                                                                          - name: Test
                                                                                                                                                  run: npm test -- --coverage --json --outputFile=coverage-report.json || true
                                                                                                                                                        
                                                                                                                                                              - name: Audit
                                                                                                                                                                      run: npm audit --json > audit-report.json 2>/dev/null || true
                                                                                                                                                                            
                                                                                                                                                                                  - name: Report
                                                                                                                                                                                          run: |
                                                                                                                                                                                                    node -e "
                                                                                                                                                                                                                const fs = require('fs');
                                                                                                                                                                                                                            let r = '# QA Report\n\n';
                                                                                                                                                                                                                                        r += '**Fecha:** ' + new Date().toISOString() + '\n\n';
                                                                                                                                                                                                                                                    try {
                                                                                                                                                                                                                                                                  const e = JSON.parse(fs.readFileSync('eslint-report.json', 'utf8'));
                                                                                                                                                                                                                                                                                let err = 0, war = 0;
                                                                                                                                                                                                                                                                                              e.forEach(f => f.messages.forEach(m => m.severity === 2 ? err++ : war++));
                                                                                                                                                                                                                                                                                                            r += '## Linting\n- Errores: ' + err + '\n- Warnings: ' + war + '\n\n';
                                                                                                                                                                                                                                                                                                                        } catch(e) { r += '## Linting\n- OK\n\n'; }
                                                                                                                                                                                                                                                                                                                                    try {
                                                                                                                                                                                                                                                                                                                                                  const t = JSON.parse(fs.readFileSync('coverage-report.json', 'utf8'));
                                                                                                                                                                                                                                                                                                                                                                r += '## Tests\n- Total: ' + (t.numTotalTests || 0) + '\n';
                                                                                                                                                                                                                                                                                                                                                                              r += '- Pasados: ' + (t.numPassedTests || 0) + '\n';
                                                                                                                                                                                                                                                                                                                                                                                            r += '- Fallidos: ' + (t.numFailedTests || 0) + '\n\n';
                                                                                                                                                                                                                                                                                                                                                                                                        } catch(e) { r += '## Tests\n- OK\n\n'; }
                                                                                                                                                                                                                                                                                                                                                                                                                    try {
                                                                                                                                                                                                                                                                                                                                                                                                                                  const a = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
                                                                                                                                                                                                                                                                                                                                                                                                                                                r += '## Seguridad\n- Vulns: ' + Object.keys(a.vulnerabilities || {}).length + '\n\n';
                                                                                                                                                                                                                                                                                                                                                                                                                                                            } catch(e) { r += '## Seguridad\n- OK\n\n'; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        fs.writeFileSync('QA-REPORT.md', r);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              - uses: actions/github-script@v7
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                script: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const fs = require('fs');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let report = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    try { report = fs.readFileSync('QA-REPORT.md', 'utf8'); } catch(e) {}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let labels = ['qa-agent'];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let title = 'QA Report - ' + new Date().toLocaleDateString('es-ES');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (report.match(/Errores: [1-9]/) || report.match(/Fallidos: [1-9]/)) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      labels.push('bug');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    title = '[BUG] ' + title;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            await github.rest.issues.create({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          owner: context.repo.owner,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        repo: context.repo.repo,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      title: title,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    body: report,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  labels: labels
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - name: Auto-fix
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  run: npx eslint src/ --ext .js --fix || true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              - name: Commit fixes
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                git config user.name "QA Agent"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          git config user.email "qa-agent@github.com"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    git add -A
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              git diff --cached --quiet || (git commit -m "Auto-fix QA" && git push)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              WORKFLOW
